[build]
  # Dossier contenant le code Django
  base = "G_Scolaire"
  # Commande de build executee par Netlify
  command = "pip install -r ../requirements.txt && python manage.py collectstatic --no-input"
  # Dossier des fichiers statiques publies
  publish = "staticfiles"
  # Dossier des fonctions Netlify
  functions = "../netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.12"

# Rediriger TOUTES les requetes vers la Django Function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/django"
  status = 200

# Sauf les fichiers statiques (servis directement par Netlify CDN)
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
