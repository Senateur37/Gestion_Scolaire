{% extends 'base.html' %}

{% block title %}{{ title }} — G-Scolaire{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-12 card-glass rounded-2xl p-8 text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-500/20 text-red-400 mb-6">
        <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
    </div>
    
    <h2 class="text-2xl font-bold text-white mb-2">{{ title }}</h2>
    <p class="text-slate-400 text-sm mb-6">
        Êtes-vous sûr de vouloir supprimer cet élément : <strong class="text-white">"{{ object }}"</strong> ? Cette action est irréversible.
    </p>

    <form method="post" class="flex justify-center gap-4">
        {% csrf_token %}
        <a href="{% url 'inventory:asset_list' %}" class="px-5 py-2.5 rounded-xl border border-slate-700 text-slate-300 hover:bg-slate-800 text-sm font-medium transition-colors">
            Annuler
        </a>
        <button type="submit" class="px-6 py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl text-sm font-semibold transition-colors shadow-lg shadow-red-500/20">
            Confirmer la suppression
        </button>
    </form>
</div>
{% endblock %}
