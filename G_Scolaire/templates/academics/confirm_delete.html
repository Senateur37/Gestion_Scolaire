{% extends 'base.html' %}

{% block title %}{{ title }} - G-Scolaire{% endblock %}

{% block content %}
<div class="bg-white shadow sm:rounded-lg max-w-2xl mx-auto mt-10">
    <div class="px-4 py-5 sm:p-6">
        <h3 class="text-lg leading-6 font-medium text-gray-900">
            {{ title }}
        </h3>
        <div class="mt-2 max-w-xl text-sm text-gray-500">
            <p>
                Êtes-vous sûr de vouloir supprimer <strong>{{ object }}</strong> ? Cette action est irréversible.
            </p>
        </div>
        <div class="mt-5">
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="inline-flex items-center justify-center px-4 py-2 border border-transparent font-medium rounded-md text-red-700 bg-red-100 hover:bg-red-200 sm:text-sm">
                    Oui, supprimer
                </button>
                <button type="button" onclick="window.history.back();" class="ml-3 inline-flex items-center justify-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                    Annuler
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
