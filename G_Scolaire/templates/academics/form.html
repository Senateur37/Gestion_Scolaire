{% extends 'base.html' %}
{% load tailwind_filters %}

{% block title %}{{ title }} - G-Scolaire{% endblock %}

{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">{{ title }}</h1>
</div>

<div class="bg-white shadow px-4 py-5 sm:rounded-lg sm:p-6 max-w-2xl">
    <form method="POST" class="space-y-6">
        {% csrf_token %}
        {{ form|crispy }}
        
        <div class="flex justify-end mt-6">
            <button type="button" onclick="window.history.back();" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 mr-3">
                Annuler
            </button>
            <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
                Enregistrer
            </button>
        </div>
    </form>
</div>
{% endblock %}
